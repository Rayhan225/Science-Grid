[package]
name = "validation-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tower-http = { version = "0.5", features = ["cors"] }
http = "1.1"
# Axum is our high-speed web server
axum = "0.7"
# Tokio allows our server to run multiple tasks asynchronously 
tokio = { version = "1.1", features = ["full"] }
# Serde translates JSON data from our React app into Rust data
serde = { version = "1.0", features = ["derive"] }
# Sha2 is our cryptographic hashing library
sha2 = "0.10"